<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121816" />
    <meta name="description" content="Playground WebAssembly di AnyBase.Net per codificare e decodificare testo con alfabeti personalizzati." />
    <base href="/" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Playground · AnyBase.Net</title>
</head>
<body>
    <div id="app">
        <div class="loading-shell" aria-label="Caricamento del playground">

            <div class="loading-track"><span></span></div>
