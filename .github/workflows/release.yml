name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v1.1.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${MANUAL_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AnyBase.Net/AnyBase.Net.sln

      - name: Build
        run: dotnet build AnyBase.Net/AnyBase.Net.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AnyBase.Net/AnyBase.Net.sln --configuration Release --no-build

      - name: Verify tag and project version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(dotnet msbuild AnyBase.Net/AnyBase.Net/AnyBase.Net.csproj -getProperty:Version -nologo | tail -n 1 | tr -d '\r')"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match project version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Pack and validate library API
        run: >-
          dotnet pack AnyBase.Net/AnyBase.Net/AnyBase.Net.csproj
          --configuration Release
          --no-build
          --output artifacts/release

      - name: Pack CLI tool
        run: >-
          dotnet pack AnyBase.Net/AnyBase.Net.Tool/AnyBase.Net.Tool.csproj
          --configuration Release
          --no-build
          --output artifacts/release

      - name: Test packed library and CLI tool
        shell: pwsh
        run: >-
          ./eng/Test-Packages.ps1
          -PackageDirectory artifacts/release
          -Version "${{ steps.version.outputs.version }}"

      - name: Build playground archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish AnyBase.Net/AnyBase.Net.Playground/AnyBase.Net.Playground.csproj \
            --configuration Release \
            --no-build \
            --output artifacts/playground \
            -p:BlazorEnableCompression=false
          sed -i 's|<base href="/" />|<base href="./" />|' artifacts/playground/wwwroot/index.html
          cp artifacts/playground/wwwroot/index.html artifacts/playground/wwwroot/404.html
          touch artifacts/playground/wwwroot/.nojekyll
          (cd artifacts/playground/wwwroot && zip -r "../../release/AnyBase.Net.Playground.${VERSION}.zip" .)

      - name: Create or update draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/release/* --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/release/* \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "AnyBase.Net ${VERSION}"
          fi

      - name: NuGet login with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/release/*.nupkg"
          --api-key "${NUGET_API_KEY}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
