name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = dotnet msbuild AnyBase.Net/AnyBase.Net/AnyBase.Net.csproj -getProperty:Version -nologo |
            Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "value=$($version.Trim())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore AnyBase.Net/AnyBase.Net.sln

      - name: Build
        run: dotnet build AnyBase.Net/AnyBase.Net.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test AnyBase.Net/AnyBase.Net.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Pack and validate library API
        run: >-
          dotnet pack AnyBase.Net/AnyBase.Net/AnyBase.Net.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Pack CLI tool
        run: >-
          dotnet pack AnyBase.Net/AnyBase.Net.Tool/AnyBase.Net.Tool.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Test packed library and CLI tool
        shell: pwsh
        run: >-
          ./eng/Test-Packages.ps1
          -PackageDirectory artifacts/packages
          -Version "${{ steps.version.outputs.value }}"

      - name: Upload packages and test results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-artifacts-${{ runner.os }}
          path: |
            artifacts/packages/*
            artifacts/test-results/**/*
          if-no-files-found: error
